<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/popup.css" />
    <script src="scripts/jquery-3.3.1.min.js"></script>
  </head>

  <body>
    <div class="ui grid container">
      <div class="sixteen wide center aligned column">
        <h1 id="title">GFG<span style="color: #ff6c0a">Hub</span></h1>
        <p id="caption">Sync your code from GeeksforGeeks to GitHub</p>
        <div class="onboarding status-block">
          <p>GitHub: <strong id="connection_status">Connecting</strong></p>
          <p id="connection_detail" hidden></p>
          <button id="authenticate" hidden>Connect GitHub</button>
          <button id="repository_action" hidden>Select Repository</button>
        </div>

        <div id="ready_state" hidden>
          <p>Repository: <span id="repo_url">Not selected</span></p>
          <p>Sync: <strong id="sync_status">Ready</strong></p>
          <button id="change_repository">Change Repository</button>
          <p class="onboarding">Solved: <span id="p_solved">0</span></p>
          <p>
            <span style="color: #5cb85c">Easy:</span>
            <span id="p_solved_easy" style="color: #000000; opacity: 0.75">0 </span>
            <span style="color: #f0ad4e">&ensp; &ensp; Medium:</span>
            <span id="p_solved_medium" style="color: #000000; opacity: 0.75">0 </span>
            <span style="color: #d9534f">&ensp; &ensp; Hard:</span>
            <span id="p_solved_hard" style="color: #000000; opacity: 0.75">0 </span>
          </p>
          <button id="reset_stats" type="button">Reset all stats</button>
          <div id="reset_confirmation" hidden>
            <p>Reset local GFG statistics?</p>
            <p>
              <button id="reset_yes" type="button">Yes</button>
              <button id="reset_no" type="button">No</button>
            </p>
          </div>
        </div>
        <div class="last-sync">
          <div>Last Sync:</div>
          <div id="last_sync_empty">No sync attempted yet</div>
          <div id="last_sync_details" hidden>
            <div id="last_sync_title"></div>
            <div id="last_sync_language"></div>
            <div id="last_sync_result"></div>
            <div id="last_sync_message"></div>
          </div>
        </div>
      </div>

      <a id="settings_URL" href="" target="_blank">Setup &amp; Settings</a>
    </div>

    <script src="scripts/oauth2.js"></script>
    <script type="text/javascript" src="scripts/popup.js"></script>
  </body>
</html>
